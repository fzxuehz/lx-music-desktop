name: Build Custom Windows

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    env:
      IS_CI: 'true'
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Get npm cache directory
        shell: pwsh
        run: echo "NPM_CACHE=$(npm config get cache)" >> $env:GITHUB_ENV

      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Build src code
        run: |
          git status --porcelain
          npm run build

      - name: Verify custom patches in dist
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -Recurse -Filter *.js
          $regexHit = $files | Select-String -Pattern 'user_api\|builtin_' | Select-Object -First 1
          if (-not $regexHit) { throw 'regex patch missing in dist' }
          $idHit = $files | Select-String -SimpleMatch 'builtin_hyw' | Select-Object -First 1
          if (-not $idHit) { throw 'builtin source id missing in dist' }
          $srcHit = $files | Select-String -SimpleMatch 'HYWmusic' | Select-Object -First 1
          if (-not $srcHit) { throw 'hyw source script missing in dist' }
          $legacyHit = $files | Select-String -SimpleMatch 'legacySourceNames' | Select-Object -First 1
          if (-not $legacyHit) { throw 'legacy prune logic missing in dist' }
          Write-Host "patch verified: $($regexHit.Path)"

      - name: Pack setup x64
        run: |
          npm run pack:win:setup:x64
          npm run pack:win:7z:x64

      - name: List outputs
        shell: pwsh
        run: Get-ChildItem build | Select-Object Name, Length

      - name: Upload Setup exe
        uses: actions/upload-artifact@v4
        with:
          name: xhz-music-win-setup
          path: build/*.exe
          if-no-files-found: error

      - name: Upload green 7z
        uses: actions/upload-artifact@v4
        with:
          name: xhz-music-win-green
          path: build/*.7z
          if-no-files-found: error
